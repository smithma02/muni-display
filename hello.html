<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <style>
    @page {
      size: 480px 800px;
      margin: 0;
    }

    body {
      font-family: 'Arial', sans-serif;
      font-weight: bold;
      background-color: white;
      color: black;
      margin: 0;
    }

    .last-updated {
      font-size: 16px;
      text-align: center;
      margin-top: 16px;
      margin-bottom: 20px;
    }

    h2 {
      text-align: center;
      font-size: 60px;
      font-weight: bold;
      margin: 24px 0 8px;
    }

    .table-wrapper {
      padding: 0 24px;
    }

    .entry {
      margin-bottom: 30px;
      text-align: left;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: flex-start; /* left-align content */
      gap: 28px;
      margin-bottom: 16px;
    }

    .circle {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background-color: black;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      aspect-ratio: 1;
    }

    .circle span {
      color: white;
      font-size: 40px;
      font-family: 'Helvetica', Arial, sans-serif;
      transform: translateY(0px);
      display: inline-block;
    }

    .destination {
      font-size: 30px;
      font-weight: normal;
    }

    .trip-times {
      display: flex;
      flex-direction: column;
    }

    .times {
      font-size: 30px;
      font-weight: bold;
      color: black;
    }
    .muni-logo {
      max-width: 300px;
      max-height: 80px;
    }
  </style>
</head>

<body>
  {% if display_logo_b64 %}
  <h2><img class="muni-logo" src="data:image/png;base64,{{ display_logo_b64 }}"></h2>
  {% else %}
  <h2>{{ display_name }}</h2>
  {% endif %}

  <div class="last-updated">
    Last Updated: {{ current_time }}
  </div>

  <div class="table-wrapper">
    {% for line in lines %}
    <div class="entry">
      <div class="header-row">
        <div class="circle"><span>{{ line.label }}</span></div>
        <div class="trip-times">
          <div class="times">{{ line.inbound_label }}: {{ line.times_in }}</div>
          <div class="times">{{ line.outbound_label }}: {{ line.times_ot }}</div>
        </div>
      </div>
    </div>
    {% endfor %}

  </div>
</body>

</html>
